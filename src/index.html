<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: data:; connect-src 'self' ws://127.0.0.1:*"/>
    <link rel="icon" type="image/svg+xml" href="/pteron.svg"/>
    <link rel="alternate icon" href="/pteron.ico"/>
    <title>pteron</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #101214;
        color: #e9ecf0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        user-select: none;
        overflow: hidden;
      }
      #root {
        width: 100%;
        height: 100%;
      }
      .app-splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        background: #101214;
      }
      .app-splash-icon {
        width: 80px;
        height: 80px;
        margin-bottom: 16px;
      }
      .app-splash-title {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.5px;
        color: #e9ecf0;
        margin-bottom: 4px;
      }
      .app-splash-sub {
        font-size: 13px;
        color: #8c95a0;
        margin-bottom: 24px;
      }
      .app-splash-bar {
        width: 180px;
        height: 3px;
        background: #23282e;
        border-radius: 2px;
        overflow: hidden;
        position: relative;
      }
      .app-splash-progress {
        width: 40%;
        height: 100%;
        background: linear-gradient(90deg, #4936B8, #EE623F);
        border-radius: 2px;
        animation: splash-shimmer 1.4s ease-in-out infinite alternate;
      }
      .app-splash-status {
        font-size: 11px;
        color: #6e7681;
        margin-top: 12px;
      }
      @keyframes splash-shimmer {
        0% { transform: translateX(0%); }
        100% { transform: translateX(150%); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="app-splash">
        <img class="app-splash-icon" src="/pteron.svg" alt="Pteron Logo" />
        <h1 class="app-splash-title">pteron</h1>
        <div class="app-splash-sub">Motion Design &amp; Video Authoring</div>
        <div class="app-splash-bar"><div class="app-splash-progress"></div></div>
        <div class="app-splash-status">Loading workspace…</div>
      </main>
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
